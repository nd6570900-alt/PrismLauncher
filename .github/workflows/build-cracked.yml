name: Build Cracked Launcher
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Clone Repository Source Code
        uses: actions/checkout@v4
        with:
          repository: 'Diegiwg/PrismLauncher-Cracked'
          ref: 'main'

      - name: Stage Production Directory Assets
        run: |
          echo "Staging raw application variables..."
          mkdir build-output
          Copy-Item -Path ".*", "*" -Destination "build-output" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload Completed App Folder
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Cracked-Windows
          path: build-output/
