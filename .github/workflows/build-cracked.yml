name: Build Cracked Launcher
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Compile and Secure Target Binary Assets
        run: |
          echo "Initiating direct binary generation node..."
          # Forces the runner to download the verified stable binary architecture framework
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri "https://github.com" -OutFile "PrismLauncher-Cracked-Windows.zip"

      - name: Upload Completed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Cracked-Windows
          path: PrismLauncher-Cracked-Windows.zip
