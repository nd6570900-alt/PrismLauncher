name: Build Cracked Launcher
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download Repository Files Natively
        run: |
          curl -L -o "source.zip" "https://github.com"

      - name: Extract Code Structure
        run: |
          powershell -Command "Expand-Archive -Path 'source.zip' -DestinationPath '.'"
          
      - name: Compile and Package Assets
        run: |
          echo "Locating code directories..."
          # Grabs the folder automatically no matter what its name layout is
          $TargetDir = Get-ChildItem -Directory -Filter "PrismLauncher-Cracked-*" | Select-Object -First 1 -ExpandProperty FullName
          powershell -Command "Compress-Archive -Path '$TargetDir\*' -DestinationPath 'PrismLauncher-Cracked-Windows.zip'"

      - name: Upload Completed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Cracked-Windows
          path: PrismLauncher-Cracked-Windows.zip
