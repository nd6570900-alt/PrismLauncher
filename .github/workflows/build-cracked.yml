name: Build Cracked Launcher
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Fetch Target Binaries Natively
        run: |
          Invoke-WebRequest -Uri "https://github.com" -OutFile "Launcher.zip"

      - name: Upload Completed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Cracked-Windows
          path: Launcher.zip
