name: Build Cracked Launcher
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Fetch Target Binaries
        run: |
          curl -L -o "Launcher.zip" "https://github.com"

      - name: Upload Completed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Cracked-Windows
          path: Launcher.zip
