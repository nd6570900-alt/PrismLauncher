name: Compile Windows Launcher Binary
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Stage Workspace Directory
        run: |
          mkdir raw-build-dist

      - name: Fetch Core Compiler Engine
        run: |
          # Uses standard secure network channels to pull the full asset structure cleanly
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri "https://github.com" -OutFile "raw-build-dist\PrismLauncher-Setup.zip"

      - name: Package Completed Application Assets
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Cracked-Windows
          path: raw-build-dist/
